</style></head><body><section id="home" class="screen active menu"><div class="panel"><div class="logo">BLUE LOCK</div><div class="tag">FOOTBALL BATTLE • FUTEBOL 3D MOBILE</div><button class="btn primary" id="play">⚽ JOGAR PARTIDA</button><button class="btn" id="team">👤 PERSONALIZAR OS 11 JOGADORES</button><p class="small" style="text-align:center">Partida de futebol web original com jogadores visíveis.</p></div></section><section id="team" class="screen menu"><div class="panel"><h2>MEU TIME</h2><p class="small">Os atributos afetam o comportamento em campo.</p><div id="cards" class="players"></div><button class="btn primary" id="back">VOLTAR</button></div></section><section id="game" class="screen game"><div class="hud"><div class="score" id="score">BLUE 0 × 0 RED</div><div class="clock" id="clock">02:00</div><div class="pos" id="pos">POSSE 50%</div></div><button class="pause" id="pause">Ⅱ</button><div class="viewport"><div class="world" id="world"><div class="field"><div class="box a"></div><div class="box b"></div><div class="goal a"></div><div class="goal b"></div><div id="playersLayer"></div><div class="ball" id="ball"></div></div></div></div><div class="stamina"><i id="bar"></i></div><div class="toast" id="toast"></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="act skill">SKILL</button><button class="act run">CORRER</button><button class="act tackle">DESARME</button><button class="act switch">TROCAR</button><button class="act pass">PASSE</button><button class="act shoot">CHUTE</button></div><div class="pausebox" id="pausebox"><div class="endbox"><h2>PAUSADO</h2><button class="btn primary" id="resume">CONTINUAR</button><button class="btn" id="quit">SAIR</button></div></div><div class="end" id="end"><div class="endbox"><h2>FIM DE JOGO</h2><div class="final" id="final">0 × 0</div><p>Partida encerrada.</p><button class="btn primary" id="again">JOGAR NOVAMENTE</button><button class="btn" id="menu">MENU</button></div></div></section><script>
const names=['Isagi','Rin','Nagi','Reo','Bachira','Chigiri','Barou','Kunigami','Aryu','Gagamaru','Yukimiya'];const speed=[82,84,70,76,93,99,80,78,81,75,90];let roster=names.map((name,i)=>({name,sp:speed[i],dr:80,sh:82,pa:78,de:70})),joy={x:0,y:0},keys={},g=null;const $=s=>document.querySelector(s);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}$('#play').onclick=start;$('#team').onclick=()=>{render();show('team')};$('#back').onclick=()=>show('home');$('#again').onclick=start;$('#menu').onclick=()=>{g=null;show('home')};$('#pause').onclick=togglePause;$('#resume').onclick=togglePause;$('#quit').onclick=()=>{g=null;show('home')};function render(){$('#cards').innerHTML=roster.map((p,i)=>`<button class="card" data-i="${i}"><b>${p.name}</b><br><span class="small">VEL ${p.sp} • DRI ${p.dr} • CHU ${p.sh} • PAS ${p.pa} • DEF ${p.de}</span></button>`).join('')}function player(p,team,i){let d=document.createElement('div');d.className='player '+team+(i===0?' selected':'');d.innerHTML=`<div class="name">${p.name}</div><div class="head"></div><div class="body"></div><div class="short"></div><div class="leg l1"></div><div class="leg l2"></div><div class="boot b1"></div><div class="boot b2"></div>`;$('#playersLayer').appendChild(d);return d}function start(){show('game');$('#playersLayer').innerHTML='';let A=[[190,425],[310,200],[310,325],[310,525],[450,180],[450,350],[450,520],[630,180],[630,330],[630,520],[850,350]],B=[[1210,425],[1090,200],[1090,325],[1090,525],[950,180],[950,350],[950,520],[770,180],[770,330],[770,520],[550,350]],ps=[];roster.forEach((p,i)=>ps.push({p,t:0,x:A[i][0],y:A[i][1],ox:A[i][0],oy:A[i][1],el:player(p,'blue',i)}));names.forEach((n,i)=>ps.push({p:{name:n,sp:75},t:1,x:B[i][0],y:B[i][1],ox:B[i][0],oy:B[i][1],el:player({name:n},'red',i+11)}));g={ps,sel:0,b:{x:700,y:425,vx:0,vy:0,owner:0},blue:0,red:0,t:120,run:true,last:performance.now(),st:100};requestAnimationFrame(loop)}function loop(now){if(!g||!g.run)return;let dt=Math.min(.035,(now-g.last)/1000);g.last=now;update(dt);draw();requestAnimationFrame(loop)}function update(dt){let p=g.ps[g.sel],b=g.b,dx=joy.x||((keys.d?1:0)-(keys.a?1:0)),dy=joy.y||((keys.s?1:0)-(keys.w?1:0)),run=keys.shift?1.55:1,sp=p.p.sp/55;if(dx||dy){p.x+=dx*sp*80*dt*run;p.y+=dy*sp*80*dt*run;if(keys.shift)g.st=Math.max(0,g.st-30*dt)}else g.st=Math.min(100,g.st+12*dt);p.x=Math.max(125,Math.min(1275,p.x));p.y=Math.max(125,Math.min(725,p.y));if(Math.hypot(p.x-b.x,p.y-b.y)<50){b.owner=0;b.x=p.x+32;b.y=p.y}if(b.owner===0){b.x+=(p.x+32-b.x)*dt*8;b.y+=(p.y-b.y)*dt*8}else{b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.985;b.vy*=.985}g.ps.forEach((q,i)=>{if(i===g.sel)return;let follow=1.4+(q.t===0?.3:0),tx=q.ox+(b.x-700)*.22,ty=q.oy+(b.y-425)*.18;q.x+=(tx-q.x)*dt*follow;q.y+=(ty-q.y)*dt*follow;if(q.t===1&&Math.hypot(q.x-b.x,q.y-b.y)<38&&Math.random()<dt*1.5)b.owner=1});if(b.x<105){g.red++;resetBall()}if(b.x>1295){g.blue++;resetBall()}g.t-=dt;if(g.t<=0){g.t=0;finish()}$('#bar').style.width=g.st+'%';$('#pos').textContent='POSSE '+(b.owner===0?'AZUL':'VERMELHO')}function resetBall(){g.b={x:700,y:425,vx:0,vy:0,owner:0};toast(g.blue+' × '+g.red)}function draw(){g.ps.forEach(q=>{q.el.style.left=(q.x-100)+'px';q.el.style.top=(q.y-100)+'px'});$('#ball').style.left=(g.b.x-100)+'px';$('#ball').style.top=(g.b.y-100)+'px';let sx=Math.max(-240,Math.min(240,(700-g.b.x)*.58)),sy=Math.max(-130,Math.min(130,(425-g.b.y)*.46));$('#world').style.transform=`translate(calc(-50% + ${sx}px),calc(-50% + ${sy}px)) scale(1.06)`;$('#score').textContent=`BLUE ${g.blue} × ${g.red} RED`;let s=Math.ceil(g.t),m=Math.floor(s/60),sec=String(s%60).padStart(2,'0');$('#clock').textContent=`0${m}:${sec}`}function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',900)}function finish(){g.run=false;$('#final').textContent=g.blue+' × '+g.red;$('#end').classList.add('show')}function togglePause(){if(!g)return;g.run=!g.run;$('#pa
